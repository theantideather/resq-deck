[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum"
version = "0.3.0"
description = "AI quant research and trading toolkit for gold (XAUUSD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
llm = ["anthropic>=1.0"]
mcp = ["mcp>=1.9"]
mt5 = ["MetaTrader5; platform_system == 'Windows'"]
dev = ["pytest>=8"]

[project.scripts]
aurum = "aurum.cli:main"
aurum-web = "aurum.web.server:main"
aurum-mcp = "aurum.mcp_server:main"

[tool.setuptools]
packages = ["aurum", "aurum.web", "aurum.execution"]

[tool.setuptools.package-data]
"aurum.web" = ["index.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
