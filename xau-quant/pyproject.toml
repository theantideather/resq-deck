[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum"
version = "0.1.0"
description = "AI quant research and trading toolkit for gold (XAUUSD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
aurum = "aurum.cli:main"

[tool.setuptools]
packages = ["aurum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
